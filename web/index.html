<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UltraRender - Lottie WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111114; }
    canvas { display: block; width: 100%; height: 100vh; cursor: grab; }

    #stats {
      position: fixed;
      top: 12px; left: 12px;
      color: #ccc;
      font: 11px/1.6 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      background: rgba(0,0,0,0.82);
      padding: 10px 14px;
      border-radius: 8px;
      pointer-events: none;
      z-index: 100;
      min-width: 180px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }
    #stats .title {
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    #stats .sep { border-top: 1px solid rgba(255,255,255,0.06); margin: 5px 0; }
    #stats .row { display: flex; justify-content: space-between; gap: 12px; }
    #stats .label { color: #666; }
    #stats .val { color: #0f0; font-weight: 500; }
    #stats .val.y { color: #fd0; }
    #stats .val.c { color: #0df; }
    #stats .val.w { color: #fff; }

    #controls {
      position: fixed;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 100;
    }
    .panel {
      background: rgba(0,0,0,0.8);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-label {
      color: #666;
      font: 10px/1 monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    button {
      background: rgba(255,255,255,0.06);
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      font: 11px monospace;
      transition: all 0.12s;
      white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,0.14); color: #fff; }
    button:active { background: rgba(255,255,255,0.22); }
    button.active { border-color: #0df; color: #0df; }
    .count-display {
      color: #fff;
      font: 13px/1 monospace;
      font-weight: 600;
      min-width: 32px;
      text-align: center;
    }

    #no-webgpu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font: 16px system-ui, sans-serif;
      text-align: center;
      background: rgba(200,40,40,0.92);
      padding: 28px 36px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <canvas id="ultra-canvas"></canvas>

  <div id="stats">
    <div class="title">UltraRender WebGPU</div>
    <div class="sep"></div>
    <div class="row">
      <span class="label">FPS</span>
      <span class="val" id="s-fps">--</span>
    </div>
    <div class="row">
      <span class="label">Draw calls</span>
      <span class="val y" id="s-draws">--</span>
    </div>
    <div class="row">
      <span class="label">Sprites</span>
      <span class="val w" id="s-sprites">--</span>
    </div>
    <div class="sep"></div>
    <div class="row">
      <span class="label">Anim</span>
      <span class="val c" id="s-anim">--</span>
    </div>
    <div class="row">
      <span class="label">Frame</span>
      <span class="val c" id="s-frame">--</span>
    </div>
    <div class="row">
      <span class="label">Subframes</span>
      <span class="val c" id="s-sub">--</span>
    </div>
    <div class="row">
      <span class="label">Tessellations</span>
      <span class="val y" id="s-tess">--</span>
    </div>
    <div class="row">
      <span class="label">Zoom</span>
      <span class="val w" id="s-zoom">1.0x</span>
    </div>
    <div class="sep"></div>
    <div class="label" id="s-status">Initializing...</div>
  </div>

  <div id="controls">
    <!-- Sprites -->
    <div class="panel">
      <button id="b-sub1">&minus;</button>
      <span class="count-display" id="c-count">1</span>
      <button id="b-add1">+</button>
      <button id="b-10">+10</button>
      <button id="b-100">+100</button>
      <button id="b-1k">+1k</button>
      <button id="b-reset" title="Reset to 1 sprite">1</button>
    </div>
    <div class="panel">
      <span class="panel-label">view</span>
      <button id="b-zoom-in" title="Zoom in">+</button>
      <button id="b-zoom-out" title="Zoom out">&minus;</button>
      <button id="b-view-reset" title="Reset zoom/pan (R)">Reset</button>
    </div>
    <div class="panel">
      <button id="b-play-pause" title="Play/Pause (Space)">Pause</button>
    </div>
    <div class="panel">
      <span class="panel-label">speed</span>
      <button id="b-speed-down" title="Slower ([)">&minus;</button>
      <span class="count-display" id="s-speed">1.0x</span>
      <button id="b-speed-up" title="Faster (])">+</button>
      <button id="b-speed-reset" title="Reset speed">1x</button>
    </div>
  </div>

  <div id="no-webgpu">
    WebGPU is not supported in this browser.<br>
    Try Chrome 113+ or Edge 113+.
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
